<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — Mind Care Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #3d3360 0%, #2a2042 50%, #1e2a42 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); backdrop-filter: blur(16px); border-radius: 24px; padding: 3rem 2.5rem; width: 100%; max-width: 420px; }
        .logo { text-align: center; font-family: 'Cormorant Garamond', serif; font-size: 2rem; color: #fff; margin-bottom: 0.5rem; }
        .logo span { color: #a89fd4; }
        .subtitle { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.85rem; margin-bottom: 2rem; }
        .alert { padding: 10px 16px; border-radius: 10px; font-size: 0.83rem; margin-bottom: 1.2rem; text-align: center; display: none; }
        .alert.error { background: rgba(220,53,69,0.2); color: #ff8a8a; border: 1px solid rgba(220,53,69,0.3); display: block; }
        .alert.success { background: rgba(40,167,69,0.2); color: #7dffb3; border: 1px solid rgba(40,167,69,0.3); display: block; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-size: 0.72rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 6px; }
        input { width: 100%; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 13px 16px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; color: #f9f5f0; outline: none; transition: border-color 0.3s; }
        input::placeholder { color: rgba(255,255,255,0.3); }
        input:focus { border-color: #a89fd4; background: rgba(255,255,255,0.1); }
        .btn { width: 100%; padding: 14px; background: #7a6fa8; color: #fff; border: none; border-radius: 100px; font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin-top: 0.5rem; transition: background 0.3s, transform 0.2s; }
        .btn:hover { background: #6a5f98; transform: translateY(-2px); }
        .btn:disabled { background: #555; cursor: not-allowed; transform: none; }
        .bottom-link { text-align: center; margin-top: 1.5rem; font-size: 0.83rem; color: rgba(255,255,255,0.45); }
        .bottom-link a { color: #a89fd4; text-decoration: none; font-weight: 500; }
        .home-link { text-align: center; margin-top: 1rem; }
        .home-link a { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 0.83rem; }
        .home-link a:hover { color: #a89fd4; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo"><span>☽</span> Mind Care Hub</div>
        <p class="subtitle">Create your account</p>
        <div class="alert" id="alert"></div>
        <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="name" placeholder="Jane Doe">
        </div>
        <div class="form-group">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="jane@email.com">
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="Min 6 characters">
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm" placeholder="••••••••">
        </div>
        <button class="btn" id="signupBtn" onclick="signupUser()">Create Account →</button>
        <div class="bottom-link">Already have an account? <a href="login.html">Login</a></div>
        <div class="home-link"><a href="index.html">← Back to Home</a></div>
    </div>
    <script>
        const supabase = window.supabase.createClient(
            'https://cxxmgmpcxgjwykbshgxl.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN4eG1nbXBjeGdqd3lrYnNoZ3hsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcxMjQxNzAsImV4cCI6MjA5MjcwMDE3MH0.diH7oc-7Jbm-rkkPQ11fnFn1KmZvlKT7BrIklYEaVI0'
        );
        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = 'alert ' + type;
        }
        async function signupUser() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirm = document.getElementById('confirm').value.trim();
            const btn = document.getElementById('signupBtn');
            if (!name || !email || !password || !confirm) { showAlert('Please fill in all fields!', 'error'); return; }
            if (password !== confirm) { showAlert('Passwords do not match!', 'error'); return; }
            if (password.length < 6) { showAlert('Password must be at least 6 characters!', 'error'); return; }
            btn.disabled = true;
            btn.textContent = 'Creating account...';
            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: { data: { full_name: name } }
            });
            if (error) {
                showAlert(error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Create Account →';
            } else {
                showAlert('Account created successfully! Please login.', 'success');
                setTimeout(() => { window.location.href = 'login.html'; }, 2000);
            }
        }
    </script>
</body>
</html>
